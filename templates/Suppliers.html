<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMS — Suppliers</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/products.css">
  <link rel="stylesheet" href="/static/css/suppliers.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo"><div class="logo-dot"></div>IMS</div>
    <div class="nav-label">Main</div>
    <nav><ul>
      <li><a href="/dashboard"><span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>Dashboard</a></li>
      <li><a href="/products"><span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></span>Products</a></li>
      <li class="active"><a href="/suppliers"><span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Suppliers</a></li>
      <li><a href="/orders"><span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>Orders</a></li>
      <li><a href="/reports"><span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>Reports</a></li>
    </ul></nav>
    <div class="sidebar-footer"><a id="logoutBtn" style="cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 class="page-title">Sup<span>pliers</span></h1>
      <div class="topbar-right"><div class="date-badge" id="dateDisplay"></div><div class="avatar" id="avatarInitial">A</div></div>
    </div>
    <div class="content">
      <div class="toolbar">
        <div class="search-wrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" placeholder="Search suppliers..." id="searchInput"></div>
        <div class="toolbar-right"><button class="btn-add" id="openModal">+ Add Supplier</button></div>
      </div>
      <div class="supplier-grid" id="supplierGrid"><p style="color:var(--muted);font-size:11px">Loading...</p></div>
    </div>
  </main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modalTitle">Add Supplier</div><button class="modal-close" id="closeModal">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Company Name</label><input type="text" id="fName" placeholder="e.g. SoundWave Inc"></div>
        <div class="form-group"><label>Contact Person</label><input type="text" id="fContact" placeholder="e.g. Raj Mehta"></div>
        <div class="form-group"><label>Email</label><input type="email" id="fEmail" placeholder="e.g. raj@soundwave.com"></div>
        <div class="form-group"><label>Phone</label><input type="text" id="fPhone" placeholder="+91 98765 43210"></div>
        <div class="form-group"><label>Category Supplied</label><input type="text" id="fCategory" placeholder="e.g. Audio, Accessories"></div>
        <div class="form-group"><label>City</label><input type="text" id="fCity" placeholder="e.g. Mumbai"></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-cancel" id="cancelModal">Cancel</button><button class="btn-save" id="saveSupplier">Save Supplier</button></div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal-overlay" id="deleteOverlay">
  <div class="modal modal-sm">
    <div class="modal-header"><div class="modal-title">Remove Supplier</div><button class="modal-close" id="closeDelete">✕</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--muted);line-height:1.6">Remove <strong id="deleteSupplierName" style="color:var(--text)"></strong>?</p></div>
    <div class="modal-footer"><button class="btn-cancel" id="cancelDelete">Cancel</button><button class="btn-delete" id="confirmDelete">Remove</button></div>
  </div>
</div>




<script src="/static/js/common.js"></script>
<script src="/static/js/suppliers.js"></script>
</body>
</html>
