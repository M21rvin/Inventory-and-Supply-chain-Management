<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMS — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <section>
    <div class="login-card">

      <div class="logo"><div class="logo-dot"></div>ISM</div>
      <p class="logo-sub">Inventory and Supply Management System</p>

      <!-- Tab switcher -->
      <div style="display:flex;gap:0;margin-bottom:28px;background:var(--surface2);border-radius:10px;padding:4px">
        <button id="tabLoginBtn"    onclick="showTab('login')"    style="flex:1;padding:9px;border-radius:7px;font-size:11px;letter-spacing:0.05em;cursor:pointer;transition:all 0.15s;border:none;font-family:'DM Mono',monospace;background:var(--accent);color:var(--bg);font-weight:600">Login</button>
        <button id="tabRegisterBtn" onclick="showTab('register')" style="flex:1;padding:9px;border-radius:7px;font-size:11px;letter-spacing:0.05em;cursor:pointer;transition:all 0.15s;border:none;font-family:'DM Mono',monospace;background:transparent;color:var(--muted)">Register Employee</button>
      </div>

      <div id="errorMsg" style="display:none;background:rgba(240,74,122,0.1);border:1px solid rgba(240,74,122,0.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#f04a7a;margin-bottom:16px"></div>
      <div id="successMsg" style="display:none;background:rgba(200,240,74,0.1);border:1px solid rgba(200,240,74,0.3);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--accent);margin-bottom:16px"></div>

      <!-- LOGIN TAB -->
      <div id="loginTab">
        <form id="loginForm">
          <div class="input-group">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="email" placeholder="admin@ims.com" required>
            </div>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" placeholder="••••••••" required>
              <button type="button" class="toggle-pw" id="togglePw">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="remember-forgot">
            <label class="checkbox-label"><input type="checkbox" id="remember"><span class="checkmark"></span>Remember me</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn-login" id="loginBtn">
            <span id="btnText">Login</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
          <div class="divider"><span>default credentials</span></div>
          <div class="register-link" style="font-size:11px;color:var(--muted)">
            Email: <strong style="color:var(--accent)">admin@ims.com</strong> &nbsp;|&nbsp; Password: <strong style="color:var(--accent)">admin123</strong>
          </div>
        </form>
      </div>

      <!-- REGISTER TAB -->
      <div id="registerTab" style="display:none">
        <form id="registerForm">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="input-group">
              <label>Full Name</label>
              <div class="input-wrap">
                <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" id="rName" placeholder="e.g. Raj Mehta" required style="padding-left:40px">
              </div>
            </div>
            <div class="input-group">
              <label>Role</label>
              <div class="input-wrap">
                <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
                <select id="rRole" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:12px 14px 12px 40px;outline:none;appearance:none">
                  <option>Manager</option><option>Employee</option><option>Warehouse Staff</option><option>Analyst</option>
                </select>
              </div>
            </div>
          </div>
          <div class="input-group">
            <label>Work Email</label>
            <div class="input-wrap">
              <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="rEmail" placeholder="your@company.com" required>
            </div>
          </div>
          <div class="input-group">
            <label>Department</label>
            <div class="input-wrap">
              <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <input type="text" id="rDept" placeholder="e.g. Logistics, Procurement">
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="input-group">
              <label>Password</label>
              <div class="input-wrap">
                <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="rPassword" placeholder="Min 6 chars" required>
              </div>
            </div>
            <div class="input-group">
              <label>Confirm</label>
              <div class="input-wrap">
                <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="rConfirm" placeholder="Repeat" required>
              </div>
            </div>
          </div>
          <button type="submit" class="btn-login" style="margin-top:8px">
            <span>Create Account</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          </button>
        </form>
      </div>

    </div>
  </section>




<script src="/static/js/common.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
